name: build-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test (build config + audit + providers + dom)
        run: npm test

      # --publish never：产物只落到 dist/，Release 统一交给下面的 action-gh-release，
      # 避免 electron-builder 和 action 各发一次导致资产重复、说明被清空
      - name: Build win (nsis + portable + zip)
        run: npm run dist

      - name: Check artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $files | Sort-Object Name | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $exe = @($files | Where-Object { $_.Extension -eq '.exe' })
          $zip = @($files | Where-Object { $_.Extension -eq '.zip' })
          if ($exe.Count -lt 2 -or $zip.Count -lt 1) {
            throw "artifacts incomplete: exe=$($exe.Count) zip=$($zip.Count), expected >=2 exe and >=1 zip"
          }
          "artifacts ok: $($exe.Count) exe + $($zip.Count) zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip

      - name: Generate release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.js

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.zip
