<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>工位看盘浮窗</title>
<link rel="stylesheet" href="./float.css" />
</head>
<body>
<aside class="card">
  <!-- 收起形态：贴边小球 -->
  <div id="ball" class="ball flat" hidden></div>
  <!-- 展开形态 -->
  <div id="expanded">
    <header>
      <span id="time">更新 --:--:--</span>
      <span id="stat"></span>
    </header>
    <section id="idx" class="idx-grid"></section>
    <section id="list" class="list"></section>
  </div>
</aside>
<script src="./float.js"></script>
</body>
</html>
